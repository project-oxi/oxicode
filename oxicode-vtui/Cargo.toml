[package]
name = "oxicode-vtui"
version = "0.81.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal UI framework for oxicode, based on vtcode-ui"
license = "MIT"
repository.workspace = true
keywords = ["tui", "terminal", "ratatui"]

[dependencies]
anstyle              = "1.0"
anyhow               = "1.0"
base64               = "0.23"
catppuccin           = { version = "2.8", default-features = false }
chrono               = { version = "0.4", features = ["serde"] }
crossterm            = { version = "0.29", features = ["event-stream", "osc52"] }
hashbrown            = "0.17"
humantime            = "2.1"
image                = { version = "0.25", default-features = false }
line-clipping        = "0.3"
nucleo-matcher       = "0.3"
once_cell            = "1"
parking_lot          = "0.12"
pulldown-cmark       = { version = "0.13", default-features = false, features = ["html"] }
ratatui              = { version = "0.30", features = ["crossterm", "unstable-rendered-line-info", "unstable-widget-ref"] }
regex                = "1"
serde                = { version = "1", features = ["derive"] }
syntect              = { version = "5.2", default-features = false, features = ["default-fancy"] }
terminal_size        = "0.4"
thiserror            = "2"
tokio                = { version = "1", features = ["full"] }
tokio-util           = { version = "0.7", features = ["codec"] }
toml                 = "1.1"
tracing              = "0.1"
unicode-segmentation = "1.13"
unicode-width        = "0.2"
signal-hook          = "0.4"
tui-widget-list      = "0.15"
arboard              = "3"
better-panic        = "0.3"
color-eyre          = "0.6"
futures             = "0.3"
human-panic         = "2.0"
ratatui-cheese      = "0.7"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "fmt"] }
tui-shimmer         = "0.1"
oxicode-vtui-compat      = { version = "0.81.0", path = "../oxicode-vtui-compat" }

