[workspace]
resolver = "2"
members = ["oxicode-catalog", "oxicode-ai", "oxicode-agent", "oxicode-cli", "oxicode-sdk", "oxicode-hashline", "oxicode-lsp", "oxicode-snapcompact", "oxicode-textarea", "oxicode-vtui", "oxicode-vtui-compat", "oxicode-api-stability"]
exclude = ["scripts"]

# Shared defaults inherited by every workspace member. Members can override
# individual fields (e.g. `description`) but should keep `edition` and
# `rust-version` in sync — `rust-version` is the source of truth for the
# Cargo 2024-edition resolver, the MSRV job in CI, and `cargo install`.
[workspace.package]
version = "0.81.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["a7garden <a7garden@icloud.com>"]
repository = "https://github.com/project-oxi/oxicode"

# NOTE: [patch.crates-io] was removed. Workspace members are auto-resolved
# by `members` above; explicit [patch] entries would block `cargo publish`.
[workspace.dependencies]
crossterm = "0.29"
thiserror = "2"
supports-color = "3.0"
portable-pty = "0.9"
nucleo = "0.5"
linkify = "0.10"
regex = "1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy", "regex-onig"] }
fuzzy-matcher = "0.3"
itertools = "0.15"
pretty_assertions = "1"
rand = "0.10"
ratatui = { version = "0.30", features = ["crossterm"] }
ratatui-core = "0.1"
textwrap = "0.16"
tui-scrollbar = "0.2"
unicode-segmentation = "1.13"
unicode-width = "0.2"
tracing = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
