[package]
name = "oxicode-hashline"
version = "0.82.0"
edition.workspace = true
rust-version.workspace = true
description = "Line-anchored patch format for AI-assisted code editing"
license = "MIT"
authors = ["a7garden <a7garden@icloud.com>"]
repository = "https://github.com/project-oxi/oxicode"
keywords = ["ai", "editing", "patch", "code"]
categories = ["development-tools", "text-processing"]
exclude = ["target/"]

[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh32"] }
lru = "0.19"
thiserror = { workspace = true }
serde = { version = "1", features = ["derive"] }
parking_lot = "0.13"
async-trait = "0.1"

[dependencies.similar]
version = "3"
optional = true

[features]
default = []
block-ops = []                           # tree-sitter based SWAP.BLK etc. (future)
three-way-merge = ["dep:similar"]        # recovery Phase 2 (M1.5)

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
