[package]
name = "oxicode-ai"
version = "0.68.0"
edition.workspace = true
rust-version.workspace = true
description = "Unified LLM API — multi-provider streaming interface for AI coding assistants"
readme = "README.md"
license = "MIT"
authors = ["a7garden <a7garden@icloud.com>"]
repository = "https://github.com/project-oxi/oxicode"
keywords = ["ai", "llm", "openai", "anthropic", "claude"]
categories = ["api-bindings", "asynchronous"]
exclude = ["target/"]

[dependencies]
# Stability tier attribute macros
oxicode-api-stability = { version = "0.68.0", path = "../oxicode-api-stability" }
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# Catalog (extracted leaf crate — model data, identity, descriptors)
oxicode-catalog = { version = "0.68.0", path = "../oxicode-catalog" }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls"] }
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# AWS SigV4 signing
hmac = "0.12"
url = "2"

# JSON Schema validation
jsonschema = { version = "0.49", default-features = false, features = ["resolve-file"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = { workspace = true }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.10"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
dirs = "6"

# File locking (fs2 for cross-platform flock, raii_flock for RAII guards)
fs2 = "0.4"
raii_flock = "0.2"
flate2 = "1"
filetime = "0.2"
base64 = "0.23"
digest = "0.10"
sha2 = "0.10"
signature = "2"
pkcs8 = "0.10"
rsa = { version = "0.9", features = ["pem"] }

# Protobuf (Devin, Cursor) — feature-gated
prost = { version = "0.14", optional = true }
tokio-stream = "0.1"

# WebSocket (GitLab Duo Workflow)
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[build-dependencies]
prost-build = { version = "0.14", optional = true }
protoc-bin-vendored = { version = "3.0", optional = true }

[features]
protobuf = ["dep:prost", "dep:prost-build", "dep:protoc-bin-vendored"]

[dev-dependencies]
mockito = "1"
tempfile = "3"
flate2 = "1"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "token_estimation"
harness = false

[[bench]]
name = "sse_parsing"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
