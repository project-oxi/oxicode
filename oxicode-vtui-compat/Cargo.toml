[package]
name = "oxicode-vtui-compat"
version = "0.81.0"
edition = "2024"
rust-version = "1.88"
description = "Compatibility stubs for vendored vtcode-ui"
license = "MIT"
repository.workspace = true

[dependencies]
anstyle   = "1.0"
anyhow    = "1.0"
hashbrown = { version = "0.17", features = ["serde"] }
regex     = "1"
serde_json = "1"
serde     = { version = "1", features = ["derive"] }
chrono    = { version = "0.4", features = ["serde"] }
tracing   = "0.1"

