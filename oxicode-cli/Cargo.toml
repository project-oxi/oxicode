[package]
name = "oxicode-cli"
version = "0.81.0"
edition.workspace = true
rust-version.workspace = true
description = "Terminal-based AI coding assistant — multi-provider, streaming-first, extensible"
readme = "README.md"
license = "MIT"
authors = ["a7garden <a7garden@icloud.com>"]
repository = "https://github.com/project-oxi/oxicode"
keywords = ["ai", "coding", "assistant", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["target/", "benches/"]

[[bin]]
name = "oxicode"
path = "src/main.rs"

[lib]
name = "oxicode"
path = "src/lib.rs"

[dependencies]
oxicode-ai = { version = "0.81.0", path = "../oxicode-ai" }
oxicode-catalog = { version = "0.81.0", path = "../oxicode-catalog" }
oxicode-agent = { version = "0.81.0", path = "../oxicode-agent" }
oxicode-sdk = { version = "0.81.0", path = "../oxicode-sdk", features = ["router", "role-routing", "role-switching", "url-resolver", "behavior"] }
oxicode-hashline = { version = "0.81.0", path = "../oxicode-hashline" }
oxicode-vtui = { version = "0.81.0", path = "../oxicode-vtui" }
oxicode-vtui-compat = { version = "0.81.0", path = "../oxicode-vtui-compat" }
oxicode-textarea = { version = "0.81.0", path = "../oxicode-textarea" }
oxicode-lsp = { version = "0.81.0", path = "../oxicode-lsp" }
lsp-types = "0.97"

# Async
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = { workspace = true }
# (rusqlite removed with the legacy local-memory stack — durable memory is
# the oxibrain daemon over oxibrain-client.)

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
parking_lot = "0.12"
crossterm = "0.29"
ratatui = { version = "0.30", features = ["crossterm", "scrolling-regions"] }
unicode-width = "0.2"
anstyle = "1"
base64 = "0.23"
nucleo = { workspace = true }
ignore = "0.4"
rand = "0.10"
sha2 = "0.10"
url = "2"

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# Dynamic loading for extensions
libloading = "0.9"
# Pinned to extism 1.21.0 (wasmtime 41.x).
#
# extism 1.30.0 (published 2026-06-04) is uncompilable: it assumes
# `wasmtime::Error: std::error::Error`, but wasmtime 43 deliberately
# removed that impl (see `wasmtime-internal-core-43.0.2/src/error/error.rs`).
# Result: 41 E0277 errors in extism's own code, not in oxicode.
#
# This pin also defends against the `cargo install` resolution issue
# (rust-lang/cargo#7169) where `cargo install --path` ignores the
# workspace `Cargo.lock` and resolves to the latest matching version.
# `^1.21` (= >=1.21, <2.0) lets cargo pick the broken 1.30.0; `=1.21.0`
# does not. See deny.toml and .cargo/audit.toml for the wasmtime-41
# CVE tracking that motivates staying on 1.21.x until extism ships a
# working wasmtime-43 release.
extism = { version = "=1.21.0", default-features = false }
tempfile = "3"
regex = "1"
# Semver
semver = { version = "1", features = ["serde"] }

# HTTP client for version check
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Self-update (optional)
self_update = { version = "0.43", default-features = false, features = ["archive-tar", "compression-flate2", "rustls"], optional = true }
serde_yaml = "0.9"

# Oxi Foundation host support.
#
#   keyring   — OS Keychain credential backend (macOS Keychain, Linux libsecret,
#               Windows Credential Manager). Used by
#               `crate::foundation::credentials::SystemKeychain`. The
#               resolver picks the in-memory backend for tests and the
#               system backend in production.
keyring = { version = "3", default-features = false, features = ["apple-native", "linux-native", "sync-secret-service", "windows-native"] }

# OAuth support
urlencoding = "2.1"
open = "5"
httparse = "1.10"

# Filesystem watching
notify = "8"

# Archive extraction for tools-manager
flate2 = "1"
tar = "0.4"
zip = "8"

# Unix primitives for Foundation v1 host:
#   - libc           — SIGTSTP, setpriority, etc.
#   - oxibrain-client — Unix-domain socket client to the OxiBrain daemon
#                       (see `crate::foundation::brain::BrainMemoryBackend`).
#     Resolved from crates.io. To hack against a live oxibrain checkout,
#     temporarily add to the WORKSPACE root Cargo.toml (do not commit):
#       [patch.crates-io]
#       oxibrain-client = { path = "../oxibrain/crates/oxibrain-client" }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
oxibrain-client = "0.12"
# Document-plane client (renamed): `workspace_search` spawns a daemonless
# `oxibrain admin serve --stdio` child. The legacy 0.2 memory transport
# above is untouched.
oxibrain-client-brain = { package = "oxibrain-client", version = "0.12.1" }

[features]
default = ["self-update", "native-browser", "foundation"]
self-update = ["dep:self_update"]
native-browser = ["oxicode-agent/native-browser"]
# `foundation` is the Oxi Foundation v1 host feature. Disabling it pulls
# nothing extra — the `keyring` crate and `oxibrain-client` (Unix) are
# always present. The flag is a marker for downstream tooling that
# resolves capabilities; the resolver itself lives in
# `oxicode-cli/src/foundation/`.
foundation = []

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
portable-pty = { workspace = true }
httpmock = "0.8"
