[package]
name = "oxicode-lsp"
version = "0.81.0"
edition.workspace = true
rust-version.workspace = true
description = "Thin LSP protocol adapter — JSON-RPC framing, lsp-types wrapper, async-process + async-lsp. Multi-server lifecycle lives in oxicode-cli."
readme = "README.md"
license = "MIT"
authors.workspace = true
repository.workspace = true
keywords = ["lsp", "language-server", "ide", "diagnostics"]
categories = ["development-tools", "asynchronous"]
exclude = ["target/", "benches/"]

[dependencies]
async-lsp = { version = "0.2", default-features = false, features = ["client-monitor", "stdio", "tokio", "omni-trait"] }
lsp-types = "0.97"
async-process = "2"

tokio = { version = "1", features = ["full"] }
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

dashmap = "6"
parking_lot = "0.12"

tracing = "0.1"
thiserror = { workspace = true }
