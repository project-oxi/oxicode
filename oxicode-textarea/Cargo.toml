[package]
name = "oxicode-textarea"
version = "0.82.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Atomic-mutation text editor widget with soft-wrap and TextElement atomicity (ported from xai-org/grok-build)"
publish = true

[dependencies]
crossterm = { workspace = true, features = ["event-stream", "bracketed-paste"] }
ratatui = { workspace = true, features = ["crossterm", "unstable-widget-ref"] }
ratatui-core = { workspace = true }
textwrap = { workspace = true }
tui-scrollbar = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
fuzzy-matcher = { workspace = true }
itertools = { workspace = true }
pretty_assertions = { workspace = true }
rand = { workspace = true }

# Mirrors the `debug-logs` feature gate grok defined with an optional
# `tracing` dependency. The textarea's `#[cfg(feature = "debug-logs")]`
# branch in `input()` is currently a no-op (we do not yet depend on
# `tracing`), but declaring the feature here satisfies clippy's
# `unexpected_cfgs` lint and preserves the upstream feature contract for
# future use. See `textarea.rs:2092`.
[features]
default = []
debug-logs = ["dep:tracing"]
