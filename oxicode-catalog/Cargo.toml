[package]
name = "oxicode-catalog"
version = "0.81.0"
edition.workspace = true
rust-version.workspace = true
description = "Model catalog — single source of truth for model data, identity, and provider descriptors (models.dev-sourced)"
license = "MIT"
authors = ["a7garden <a7garden@icloud.com>"]
repository = "https://github.com/project-oxi/oxicode"
keywords = ["ai", "llm", "catalog", "models"]
categories = ["api-bindings"]
exclude = ["target/"]

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Snapshot decompression (embedded models.dev _snapshot.json.gz)
flate2 = "1"

# Runtime model discovery (local servers: ollama/lmstudio/vllm)
# Async runtime (catalog enrichment retry backoff)
tokio = { version = "1", features = ["rt", "time", "macros"] }
# Home-directory resolution for product_env (OXICODE_HOME / ~/.oxicode)
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"

# Logging / errors
tracing = "0.1"
thiserror = { workspace = true }

# Cache mtime checks
filetime = "0.2"

[dev-dependencies]
tempfile = "3"
